[project]
name = "fhir-mcp"
version = "0.2.0"
description = "The trustworthy FHIR bridge for AI agents — MCP server with reproducible clinical evals, reversible de-identification, and CDS Hooks."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Dhairya Shah" }]
requires-python = ">=3.11"
keywords = ["fhir", "mcp", "healthcare", "ai", "claude", "hl7", "clinical-decision-support", "deidentification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    "structlog>=24.1",
    "typer>=0.12",
    "rich>=13.7",
    "anyio>=4.4",
    "pyjwt[crypto]>=2.13",
]

[project.optional-dependencies]
# Optional NLP-backed PHI detection. Default pipeline is regex-only.
deid-advanced = [
    "presidio-analyzer>=2.2.355",
    "presidio-anonymizer>=2.2.355",
    "spacy>=3.7",
]
cloud = [
    "supabase>=2.7",
    "langfuse>=2.50",
    "asyncpg>=0.29",
]
dev = [
    "ruff>=0.6",
    "pyright>=1.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "anthropic>=0.39",
]

[project.scripts]
fhir-mcp = "fhir_mcp.cli:app"

[project.urls]
Homepage = "https://github.com/DhairyaShah981/fhir-mcp"
Issues = "https://github.com/DhairyaShah981/fhir-mcp/issues"
Repository = "https://github.com/DhairyaShah981/fhir-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fhir_mcp"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pyright>=1.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "anthropic>=0.39",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.pyright]
include = ["src", "evals", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = "warning"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "evals"]
markers = [
    "eval: clinical/de-id/code eval tests (may call judge LLM, may be slow)",
    "live: tests that hit external FHIR/terminology services",
]
