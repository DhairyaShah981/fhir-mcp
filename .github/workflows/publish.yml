# Publish to PyPI.
#
# Two publishing modes are supported — set ONE up before the next tag push:
#
#   Mode A (recommended): PyPI Trusted Publishing via OIDC
#     1. Go to https://pypi.org/manage/account/publishing/
#     2. "Add a new pending publisher" with:
#          PyPI Project Name : fhir-mcp
#          Owner             : DhairyaShah981
#          Repository name   : fhir-mcp
#          Workflow filename : publish.yml
#          Environment name  : pypi
#     3. Create the `pypi` environment in this repo
#        (Settings → Environments → "New environment" → name = pypi).
#     4. Push a `vX.Y.Z` tag.
#
#   Mode B (fallback): API token
#     1. Generate a project-scoped token at https://pypi.org/manage/account/token/
#     2. Add it as the repo secret PYPI_API_TOKEN.
#     3. Push a `vX.Y.Z` tag.
#
# The workflow auto-detects which mode is configured and uses it.

name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only, do not upload"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write  # required for PyPI trusted publishing (OIDC)

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fhir-mcp

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync deps
        run: uv sync --all-extras --dev

      - name: Lint
        run: uv run ruff check src evals tests

      - name: Type check
        run: uv run pyright src

      - name: Test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run pytest tests evals --cov=src/fhir_mcp --cov-fail-under=90

      - name: Build wheel + sdist
        run: uv build

      - name: Show what we built
        run: ls -la dist/

      - name: Publish via trusted publishing (OIDC)
        if: ${{ !inputs.dry_run && !env.PYPI_API_TOKEN }}
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

      - name: Publish via API token (fallback)
        if: ${{ !inputs.dry_run && env.PYPI_API_TOKEN }}
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      - name: Dry-run notice
        if: ${{ inputs.dry_run }}
        run: echo "::notice ::dry_run=true — wheel + sdist built but not uploaded."
