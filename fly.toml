# fly.toml app configuration file generated for dhairya-fhir-mcp on 2026-06-23T10:23:06+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'dhairya-fhir-mcp'
primary_region = 'bom'

[build]
  dockerfile = 'Dockerfile'

[env]
  FHIR_MCP_BACKEND = 'synthea'
  FHIR_MCP_HOST = '0.0.0.0'
  FHIR_MCP_PORT = '8000'
  FHIR_MCP_STATE_DIR = '/data'

[[mounts]]
  source = 'fhir_mcp_state'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
